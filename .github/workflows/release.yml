name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/release.yml@a6e9d2c25f434bba7e8164c5567379511b1656c8  # v0.3.3
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
