name: Dependabot Approve and Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dependabot:
    name: Dependabot
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/dependabot.yml@a6e9d2c25f434bba7e8164c5567379511b1656c8 # v0.3.3
    secrets:
      pr_approve_and_merge_pem: ${{ secrets.PR_APPROVE_AND_MERGE_PEM }}
